<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史实例 — 排程求解系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">排程求解系统</div>
    <div class="brand-sub">运筹优化与排程求解</div>
    <nav id="nav"></nav>
    <div class="section-label">问题实例</div>
    <select id="problem-picker"></select>
  </aside>
  <main class="main">
    <div class="page-head">
      <h1>历史实例</h1>
      <span class="sub">每次编辑留下的版本化 JSON 快照</span>
    </div>

    <div class="card">
      <h2>实例版本</h2>
      <p class="small muted">每次保存都会把上一版本归档，并递增一个单调递增的版本号
        （底层使用文件锁 + 原子写入）。</p>
      <table><thead><tr><th>实例</th><th>当前版本</th><th>历史版本</th><th>更新时间</th><th></th></tr></thead>
        <tbody id="rows"></tbody></table>
    </div>

    <div class="card" id="version-card" style="display:none">
      <h2 id="version-title">版本历史</h2>
      <table><thead><tr><th class="num">版本</th><th>名称</th><th class="num">任务数</th><th>更新时间</th><th></th></tr></thead>
        <tbody id="version-rows"></tbody></table>
      <div class="btn-row"><button class="btn" onclick="hideVersion()">关闭</button></div>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script>
let problems = [];
let activeProblem = null;

initSidebar('history.html');

async function load() {
  const r = await api('/problems');
  problems = r.problems;
  const rows = [];
  for (const p of problems) {
    const v = await api(`/problems/${p.id}/versions`).catch(() => ({ versions: [] }));
    rows.push(`
      <tr>
        <td class="mono">${escapeHtml(p.id)}</td>
        <td class="num">v${p.version}</td>
        <td><span class="badge info">${v.versions.length} 个已归档</span></td>
        <td class="small muted">${escapeHtml(p.updated_at)}</td>
        <td><button class="btn sm" onclick='showVersion("${escapeHtml(p.id)}")'>历史</button></td>
      </tr>`);
  }
  document.getElementById('rows').innerHTML = rows.join('') ||
    '<tr><td colspan="5" class="empty">暂无实例。</td></tr>';
}

async function showVersion(id) {
  activeProblem = id;
  const cur = await api(`/problems/${id}`);
  const v = await api(`/problems/${id}/versions`);
  document.getElementById('version-card').style.display = 'block';
  document.getElementById('version-title').textContent = `版本历史 — ${id}（当前 v${cur.version}）`;
  const rows = [
    `<tr style="background:#f0f9ff"><td class="num"><b>v${cur.version}（当前）</b></td>
      <td>${escapeHtml(cur.name)}</td><td class="num">${cur.tasks.length}</td>
      <td class="small muted">${escapeHtml(cur.updated_at)}</td><td></td></tr>`,
  ];
  for (const x of v.versions.slice().reverse()) {
    rows.push(`
      <tr><td class="num">v${x.version}</td><td>${escapeHtml(x.name)}</td>
        <td class="num">${x.n_tasks}</td><td class="small muted">${escapeHtml(x.updated_at)}</td>
        <td><button class="btn sm" onclick='restore(${x.version})'>恢复</button></td></tr>`);
  }
  document.getElementById('version-rows').innerHTML = rows.join('');
}

async function restore(version) {
  if (!confirm(`将 v${version} 恢复为 ${activeProblem} 的当前版本？`)) return;
  const old = await api(`/problems/${activeProblem}/versions/${version}`);
  await api(`/problems/${activeProblem}`, { method: 'PUT', body: JSON.stringify(old) });
  toast('已恢复（并生成了一个新的版本）');
  await load();
  showVersion(activeProblem);
}

function hideVersion() { document.getElementById('version-card').style.display = 'none'; }

load().catch(e => toast(e.message, 'error'));
</script>
</body>
</html>
